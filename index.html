<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control Carrito IoT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Control Carrito IoT</h1>

    <div class="ip-config">
      <label for="ipCarrito">IP del carrito (ESP8266):</label>
      <input type="text" id="ipCarrito" placeholder="Ej: 192.168.1.80">
      <button id="guardarIp">Guardar</button>
    </div>

    <p class="info-ip" id="ipActual">IP actual: -</p>

    <div class="controls-grid">
      <button data-cmd="adelante">↑ Adelante</button>
      <button data-cmd="atras">↓ Atrás</button>
      <button data-cmd="detener" class="danger">■ Detener</button>

      <button data-cmd="vueltadelantederecha">↗ Adelante Der.</button>
      <button data-cmd="vueltadelanteizquierda">↖ Adelante Izq.</button>

      <button data-cmd="vueltaatrasderecha">↘ Atrás Der.</button>
      <button data-cmd="vueltaatrasizquierda">↙ Atrás Izq.</button>

      <button data-cmd="giro90derecha">⟳ Giro 90° Der.</button>
      <button data-cmd="giro90izquierda">⟲ Giro 90° Izq.</button>

      <button data-cmd="giro360derecha">⟳ Giro 360° Der.</button>
      <button data-cmd="giro360izquierda">⟲ Giro 360° Izq.</button>
    </div>

    <div class="status">
      <h2>Estado</h2>
      <p id="statusText">Esperando comando...</p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
